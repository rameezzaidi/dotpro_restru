{% extends "rms/base.html" %}{% load rms_tags %}
{% block content %}
<div class="page-head"><div><h1>New purchase order</h1></div><a class="btn" href="{% url 'purchase_orders' %}">← Back</a></div>
<form method="post" class="card" style="max-width:900px"><div class="card-b">{% csrf_token %}
  <div class="grid-2">
    <div class="field"><label>{% tr "Branches" %}</label><select class="input" name="branch" required>
      {% for b in branches %}<option value="{{ b.pk }}" {% if default_branch and default_branch.pk == b.pk %}selected{% endif %}>{{ b.name }}</option>{% endfor %}</select></div>
    <div class="field"><label>{% tr "Suppliers" %}</label><select class="input" name="supplier" required><option value="">Select…</option>
      {% for s in suppliers %}<option value="{{ s.pk }}">{{ s.name }}</option>{% endfor %}</select></div>
  </div>
  <div class="field"><label>{% tr "Notes" %}</label><input class="input" name="notes"></div>
  <h3 style="margin:10px 0">Lines</h3>
  <div id="lines">
    <div class="row" data-row style="flex-wrap:nowrap;margin-bottom:8px">
      <select class="input" name="ingredient" style="flex:3"><option value="">Ingredient…</option>{% for i in ingredients %}<option value="{{ i.pk }}">{{ i.name }} ({{ i.unit }})</option>{% endfor %}</select>
      <input class="input" name="qty" type="number" step="0.001" min="0" placeholder="Qty" style="flex:1">
      <input class="input" name="cost" type="number" step="0.01" min="0" placeholder="Unit cost" style="flex:1">
      <button type="button" class="btn sm danger" data-remove-row>{% icon 'x' 14 %}</button></div>
  </div>
  <template id="row-tpl"><div class="row" data-row style="flex-wrap:nowrap;margin-bottom:8px">
      <select class="input" name="ingredient" style="flex:3"><option value="">Ingredient…</option>{% for i in ingredients %}<option value="{{ i.pk }}">{{ i.name }} ({{ i.unit }})</option>{% endfor %}</select>
      <input class="input" name="qty" type="number" step="0.001" min="0" placeholder="Qty" style="flex:1">
      <input class="input" name="cost" type="number" step="0.01" min="0" placeholder="Unit cost" style="flex:1">
      <button type="button" class="btn sm danger" data-remove-row>{% icon 'x' 14 %}</button></div></template>
  <button type="button" class="btn sm" data-add-row="row-tpl" data-target="lines">{% icon 'plus' 14 %} Add line</button>
  <div class="row" style="margin-top:18px"><button class="btn primary">{% icon 'check' 16 %} Create &amp; send</button></div>
</div></form>
{% endblock %}
